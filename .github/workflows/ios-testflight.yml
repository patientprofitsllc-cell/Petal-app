name: iOS build and upload to TestFlight

# Runs only when you press "Run workflow" on the Actions tab. Never on push.
on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'App version shown on the App Store (for example 1.0)'
        required: true
        default: '1.0'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    # Capacitor 8 needs Xcode 26 or newer. macos-26 (Apple silicon) has it.
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MARKETING_VERSION: ${{ inputs.marketing_version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Check that all secrets are set (names only, values are never printed)
        env:
          S_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          S_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          S_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$S_KEY_ID" ] && missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -z "$S_ISSUER" ] && missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -z "$S_P8" ] && missing="$missing APP_STORE_CONNECT_API_KEY_P8"
          [ -z "$S_TEAM" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings > Secrets and variables > Actions. See docs/APP_STORE_CONNECT_SETUP.md."
            exit 1
          fi
          echo "All four secrets are set."

      - name: Check that the bundle ID is not the placeholder
        run: |
          APP_ID=$(node -e "const s=require('fs').readFileSync('capacitor.config.ts','utf8');const m=s.match(/appId:\s*'([^']+)'/);console.log(m?m[1]:'')")
          echo "Bundle ID in capacitor.config.ts: $APP_ID"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "com.yourcompany.petal" ]; then
            echo "::error::Change appId in capacitor.config.ts to your real bundle ID first."
            exit 1
          fi
          if ! echo "$APP_ID" | grep -Eq '^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$'; then
            echo "::error::appId '$APP_ID' is not a valid bundle ID."
            exit 1
          fi

      - name: Check Xcode is version 26 or newer
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR is too old for Capacitor 8 (needs 26+)."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packages
        run: npm ci

      - name: Make the icon and launch image
        run: npm run assets

      - name: Bundle the web app (fails if anything still needs a website)
        run: npm run bundle:ios

      - name: Create the iOS project and copy the app into it
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Generate all icon and launch image sizes
        run: npx --yes @capacitor/assets@3.0.5 generate --ios

      - name: Patch Info.plist (iPhone portrait only, export compliance)
        run: node scripts/ios-patch.mjs ios/App/App/Info.plist

      - name: Add the privacy manifest to the app
        run: |
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby scripts/ios-add-privacy-manifest.rb ios/App/App.xcodeproj ios-config/PrivacyInfo.xcprivacy

      - name: Set the build number (date and time, UTC, so it can never repeat)
        run: |
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Build number: $BUILD_NUMBER, version: $MARKETING_VERSION"

      - name: Save the App Store Connect API key to a temporary file
        env:
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          printf '%s\n' "$KEY_P8" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: List Xcode schemes (for the log)
        run: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Archive (cloud-managed signing with the API key)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p build
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$KEY_ID"
                -authenticationKeyIssuerID "$ISSUER_ID")
          COMMON=(-project ios/App/App.xcodeproj -scheme App -configuration Release
                  -destination 'generic/platform=iOS'
                  -archivePath build/Petal.xcarchive
                  DEVELOPMENT_TEAM="$TEAM_ID"
                  MARKETING_VERSION="$MARKETING_VERSION"
                  CURRENT_PROJECT_VERSION="$BUILD_NUMBER")
          # First try: normal automatic signing.
          if ! xcodebuild archive "${COMMON[@]}" CODE_SIGN_STYLE=Automatic "${AUTH[@]}"; then
            echo "::warning::Signed archive failed (often 'team has no devices'). Retrying unsigned; the export step signs it with the distribution certificate."
            rm -rf build/Petal.xcarchive
            xcodebuild archive "${COMMON[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          fi

      - name: Export the .ipa (signs with the App Store distribution certificate)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>destination</key><string>export</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Petal.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
          ls -la build/export

      - name: Check the .ipa before uploading
        run: |
          IPA=$(ls build/export/*.ipa | head -1)
          echo "IPA: $IPA"
          rm -rf build/ipa-check && mkdir build/ipa-check
          unzip -q "$IPA" -d build/ipa-check
          APP=$(ls -d build/ipa-check/Payload/*.app | head -1)
          PLIST="$APP/Info.plist"
          GOT_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          GOT_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          GOT_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          echo "Bundle ID: $GOT_ID   Version: $GOT_VER   Build: $GOT_BUILD"
          [ "$GOT_BUILD" = "$BUILD_NUMBER" ] || { echo "::error::Build number in the .ipa ($GOT_BUILD) is not $BUILD_NUMBER"; exit 1; }
          [ "$GOT_VER" = "$MARKETING_VERSION" ] || { echo "::error::Version in the .ipa ($GOT_VER) is not $MARKETING_VERSION"; exit 1; }
          [ -f "$APP/PrivacyInfo.xcprivacy" ] || { echo "::error::PrivacyInfo.xcprivacy is missing from the app"; exit 1; }
          [ ! -e "$APP/public/sw.js" ] || { echo "::error::sw.js should not be in the iPhone app"; exit 1; }
          echo "Checks passed."
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows in TestFlight after Apple finishes processing (usually 5 to 30 minutes)."

      - name: Remove the API key file
        if: always()
        run: rm -f "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8
